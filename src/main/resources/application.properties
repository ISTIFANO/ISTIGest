# Load secrets / local config from project root (.env is gitignored)
spring.config.import=optional:file:.env[.properties]

## DATABASE CONFIGURATION
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Enables SQL logging (optional, useful for debugging)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

## RABBITMQ CONFIGURATION
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.queue=${RABBITMQ_QUEUE}

## SERVER CONFIGURATION
server.port=${SERVER_PORT}

## SWAGGER / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

## LOGGING (optional, useful for debugging)
logging.level.org.springframework=INFO
logging.level.com.fooddelivery=DEBUG
