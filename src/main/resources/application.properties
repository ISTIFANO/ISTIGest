## DATABASE CONFIGURATION
spring.datasource.url=jdbc:postgresql://localhost:5432/food_delivery
spring.datasource.username=delivery_admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Enables SQL logging (optional, useful for debugging)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

## RABBITMQ CONFIGURATION
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.queue=delivery.queue

## SERVER CONFIGURATION
server.port=8081

## SWAGGER / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

## LOGGING (optional, useful for debugging)
logging.level.org.springframework=INFO
logging.level.com.fooddelivery=DEBUG
